services:
  db:
    image: postgres:17-alpine
    container_name: lost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lost}
      POSTGRES_USER: ${POSTGRES_USER:-lost_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - lost_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lost_dev} -d ${POSTGRES_DB:-lost}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lost_postgres_data: